; Throwaway: independent RX monitor for verifying spike_siren_tx's output.
; Runs on a SECOND ESP32-S3 + CC1101 so the transmitter is not trying to
; receive its own signal (which a single CC1101 cannot do cleanly).

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
