; platformio.local.ini (gitignored) supplies -DFIREBASE_WEB_API_KEY; copy
; platformio.local.ini.example and fill in the real key from
; web/.env.local's VITE_FIREBASE_API_KEY before building. Without it,
; main.cpp falls back to a placeholder that will fail RTDB auth.
[platformio]
extra_configs = platformio.local.ini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
; 115200, not the 460800 default. This CH340 fails partway through the
; stub upload at the higher rate ("A fatal error occurred: Invalid head of
; packet (0x01)") while esptool's own chip_id probe at 115200 works fine.
; Slower, but it completes.
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    mobizt/FirebaseClient@^2.0.0
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
    ${common.firebase_web_api_key_flag}
    ; RULED OUT: -DCONT_STACKSIZE=8192 (doubling loop()'s cooperative
    ; stack) was tested here to address a Soft WDT reset that reproduced
    ; only when mintCustomToken() was called from loop(), never from
    ; setup() — but it caused a full boot loop (no serial output at all,
    ; matching esp8266/Arduino#6166's report of the same flag causing
    ; rst cause:4 boot loops) on this board/core combination. Do not
    ; re-enable without a different, more targeted approach.

; ESP32-S3 (QFN56 rev v0.2, 8MB embedded PSRAM, 16MB flash, native
; USB-Serial/JTAG). Bought to unblock cloud EVENT WRITES, which are
; impossible on the D1 Mini: heap fragmentation pins the largest contiguous
; block at ~3.4KB after the first TLS cycle, and a write below that floor
; resets the board. See cloud_client.cpp's header comment.
;
; None of the d1_mini workarounds above apply here: native USB means no
; CH340, so no 115200 upload cap and no 1s EN-pulse reset dance.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; The board definition defaults to default_8MB.csv, but this chip has 16MB
; (confirmed by esptool flash_id). Without this the upper 8MB is unused and
; the LittleFS partition is smaller than it needs to be.
board_build.partitions = default_16MB.csv
; provision_store.cpp uses LittleFS, but PlatformIO's ESP32 default for
; `-t uploadfs` is SPIFFS — without this the uploaded image is unreadable
; and the device silently falls back to the setup portal.
board_build.filesystem = littlefs
; PSRAM IS DELIBERATELY LEFT OFF. The stock esp32-s3-devkitc-1 profile is
; the N8 "No PSRAM" variant, so PSRAM stays uninitialized and
; ESP.getPsramSize() reports 0 even with -DBOARD_HAS_PSRAM set.
;
; Enabling it via `board_build.arduino.memory_type = qio_qspi` was tried on
; this board and made it boot SILENTLY — no serial output at all, where the
; identical build without that line prints its banner and starts the setup
; portal. That was the only changed line, so the mode is wrong for this
; part and it hangs in early init before Serial comes up.
;
; Not worth chasing: the firmware uses 61KB of 327KB internal SRAM, and the
; ESP8266 fragmentation blocker this port exists to fix is already gone
; without PSRAM. Revisit only if something here ever needs large buffers,
; and check the exact module variant first.
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    mobizt/FirebaseClient@^2.0.0
build_flags =
    -DBOARD_HAS_PSRAM
    ; REQUIRED for any Serial output over the native USB port. The
    ; esp32-s3-devkitc-1 board definition sets ARDUINO_USB_MODE=1 but NOT
    ; this, so `Serial` binds to hardware UART0 (the physical TX/RX pins)
    ; instead of USB CDC. Symptom without it: flashing and verifying work
    ; perfectly over USB, but the serial monitor is completely silent —
    ; which looks exactly like a boot loop or a dead board. It is neither.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ${common.firebase_web_api_key_flag}

[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -std=gnu++17
    -Isrc
test_build_src = yes
build_src_filter =
    -<*>
    +<alarm_state.cpp>
    +<eeprom_store.cpp>
    +<config_parser.cpp>
    +<ev1527_frame.cpp>
    +<siren_address.cpp>
    +<remote_control.cpp>
