; Throwaway spike: log EVERY decoded 433MHz packet, no debounce, no dedup.
; Mirrors spike_cc1101/platformio.ini exactly — same board, same flags.
; PSRAM deliberately NOT enabled (memory_type = qio_qspi boots silently).

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
