; RMT-driven EV1527 transmitter for a bare 433MHz ASK module.
;
; Exists because the CC1101 FIFO path quantises every pulse to ~62us symbols,
; which distorts the bit ratio (bit0 goes out at 3.25:1 against the panel's
; 2.88:1). RMT is hardware-timed with ~1us resolution and no quantisation, and
; it is immune to WiFi interrupt jitter. It cannot drive the CC1101 on this
; wiring - GDO2 is not connected on that module - so this needs a plain ASK
; transmitter (FS1000A / XY-FST style, VCC/GND/DATA).
;
; Same board profile as the other ESP32-S3 spikes. PSRAM deliberately NOT
; enabled (memory_type = qio_qspi boots silently on this part).

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
